<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Form</title>
<style>
:root{--primary:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1000px;margin:auto;padding:22px}
header{background:#fff;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 4px 18px #0000000d}
h1{margin:0 0 8px;font-size:28px}
.subtitle{color:var(--muted)}
.section{background:var(--card);border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #0000000d}
.section-header{display:flex;align-items:center;gap:14px;border-bottom:2px solid #e8edf5;padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.section-person{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.person-photo{width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid #dfe7f3;background:#f8fafc}
.person-meta{display:flex;flex-direction:column;gap:4px}
.section-title{font-size:20px;font-weight:700}
.person-name{font-size:16px;color:var(--muted);font-weight:600}
.student-details{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.class-field{flex:1 1 240px}
.class-field label{display:block;font-weight:700;margin-bottom:8px}
.class-field select{width:100%;border:1px solid #cfd8e6;border-radius:10px;padding:11px 12px;background:#fff;font:inherit}
.class-field input{width:100%;border:1px solid #cfd8e6;border-radius:10px;padding:11px 12px;background:#fff;font:inherit}
.question{padding:16px 0;border-bottom:1px solid #edf1f6}
.question:last-child{border-bottom:0}
.qtext{font-weight:600;margin-bottom:12px}
.options{display:flex;gap:10px;flex-wrap:wrap}
.option{border:1px solid #d7deea;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff}
.option:hover{border-color:var(--primary)}
.option input{margin-right:7px}
.comment-wrap{display:none;margin-top:12px}
.comment-wrap.show{display:block}
.comment{width:100%;min-height:75px;border:1px solid #cfd8e6;border-radius:10px;padding:10px;resize:vertical;font:inherit}
.actions{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(8px);padding:14px 0;display:flex;gap:10px;justify-content:center;border-top:1px solid #e5eaf2}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:white}
.secondary{background:#e8eef8;color:#172033}
.progress{height:8px;background:#e6ebf3;border-radius:99px;overflow:hidden;margin-top:15px}
.progress-bar{height:100%;width:0;background:var(--primary);transition:.2s}
.note{font-size:13px;color:var(--muted);margin-top:10px}

.section { display:none; }
.section.active { display:block; }
.navigation {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:18px 0 80px;
}
.navigation button { min-width:120px; }
.navigation .next { margin-left:auto; }
.section-indicator {
  font-weight:700;
  margin-top:8px;
  color:#2563eb;
}

@media(max-width:600px){.container{padding:12px}.section{padding:16px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>40-Section Assessment Form</h1>
  <div class="subtitle">40 sections × 4 questions = 160 questions</div>
  <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
  <div id="progressText" class="note">0 of 160 questions answered</div>
<div id="sectionIndicator" class="section-indicator">Section 1 of 40</div>
</header>

<form id="assessmentForm"></form>

<div class="navigation">
  <button type="button" class="secondary" id="prevBtn" onclick="previousSection()">Previous</button>
  <button type="button" class="primary next" id="nextBtn" onclick="nextSection()">Next</button>
</div>

<div class="actions">
  <button type="button" class="secondary" onclick="clearForm()">Clear Form</button>
  <button type="button" class="primary" id="saveResponsesBtn" onclick="saveToGoogleSheet()" hidden>Save Responses</button>
</div>
<div id="saveStatus" class="note" role="status" aria-live="polite" style="text-align:center"></div>
</div>

<script>
const OPTIONS = ["Excellent", "Standard", "Good", "Satisfactory", "Poor", ];
const SECTIONS = 40;
const QUESTION_TEXTS = [
  "1: Subject Knowledge",
  "2: Teaching Skill",
  "3: Sincerity towards The Cadets",
  "4: Personality & Behaviour"
];
const QUESTIONS_PER_SECTION = QUESTION_TEXTS.length;
const GOOGLE_SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdJ7Jf-0Hlj_ON2u8sIIaK0lq2F34Q96el5MbOJiHJt1AnB5KrapnXKw0SE0M93RLM/exec"
const SECTION_PHOTOS = [
  "1. Md. Nazrul Islam.jpg",
  "10. Muhammad Shahab Uddin.jpg",
  "11. Mukti Rani Modak.JPG",
  "12. Syed Selimuzzaman.JPG",
  "13. Muhammad Abul Kalam Azad.jpg",
  "14. Md. Mohiuddin Khan.jpg",
  "15. Safina Rahat.jpg",
  "16. Arif sir.jpg",
  "17. Nazmus Shahid Sir.jpg",
  "2. Lt. Col. Tahsin Salehin.jpg",
  "2. Vice Principal.jpg",
  "25. Md. Matiur Rahman.jpg",
  "26. Abu Nayeem Mohammad Ekram.JPG",
  "27. Joydev Mondal.JPG",
  "28. Metun Mondol.jpg",
  "29. Mohsin Emran.jpg",
  "3. Adjutant Major Ali.jpg",
  "3. Jamuna Madam.jpg",
  "3. MO-Rashed.jpg",
  "33. Nazim Al Hasan.jpg",
  "34. Mst. Taskia.jpg",
  "35. Jannatul Ferdous.jpg",
  "4. Md. Taufiqul Alam.jpg",
  "5. Md. Tareekul Haq.jpg",
  "6. Pradipta Sir.jpg",
  "7. Md. Mahbubul Alam.jpg",
  "8. Mes. Asmaul Mahmuda Taslima.jpg",
  "9. Md. Main Uddin Khan.JPG",
  "AO.jpg",
  "Ibrahim Molla.jpg",
  "Indrajit Kundu.jpg",
  "Md Iftekhar Alam.jpg",
  "Mumin Bhai.jpg",
  "Munni Madam.jpg",
  "Nazim Al Hasan.jpg",
  "Nazmul Hasan.jpg",
  "Nazrul sir.jpg",
  "Sazzadur Rahman.jpg",
  "AO.jpg",
  "Ibrahim Molla.jpg"
];
let submissionInProgress = false;

function getSectionPhotoName(index){
  const photoName = SECTION_PHOTOS[index] || SECTION_PHOTOS[index % SECTION_PHOTOS.length];
  const name = photoName.replace(/^\d+\.\s*/, "").replace(/\.[^.]+$/, "").trim();
  return { photoName, name };
}

function buildForm(){
  const form = document.getElementById("assessmentForm");
  let html = "";
  for(let s=1;s<=SECTIONS;s++){
    const { photoName, name } = getSectionPhotoName(s - 1);
    const safePhotoPath = `photo/${encodeURIComponent(photoName)}`;
    html += `<section class="section">
      ${s === 1 ? `<div class="student-details">
        <div class="class-field">
          <label for="className">Class <span aria-hidden="true">*</span></label>
          <select id="className" name="className" required>
            <option value="">Select a class</option>
            <option value="VII">VII</option>
            <option value="VIII">VIII</option>
            <option value="IX">IX</option>
            <option value="X">X</option>
            <option value="XI">XI</option>
            <option value="XII">XII</option>
          </select>
        </div>
        <div class="class-field">
          <label for="houseName">House <span aria-hidden="true">*</span></label>
          <select id="houseName" name="houseName" required>
            <option value="">Select a house</option>
            <option value="Shaheed Suhrawardy House">Shaheed Suhrawardy House</option>
            <option value="Sher-e-Bangla House">Sher-e-Bangla House</option>
            <option value="Shariatullah House">Shariatullah House</option>
          </select>
        </div>
        <div class="class-field">
          <label for="formName">Form <span aria-hidden="true">*</span></label>
          <select id="formName" name="formName" required>
            <option value="">Select a form</option>
            <option value="A">A</option>
            <option value="B">B</option>
          </select>
        </div>
        <div class="class-field">
          <label for="cadetName">Cadet Name (optional)</label>
          <input id="cadetName" name="cadetName" type="text" maxlength="200">
        </div>
        <div class="class-field">
          <label for="cadetNumber">Cadet Number (optional)</label>
          <input id="cadetNumber" name="cadetNumber" type="text" maxlength="100">
        </div>
      </div>` : ""}
      <div class="section-header">
        <div class="section-person">
          <img class="person-photo" src="${safePhotoPath}" alt="${name}">
          <div class="person-meta">
            <div class="section-title">${name}</div>
          </div>
        </div>
      </div>`;
    for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
      const id = `s${s}q${q}`;
      html += `<div class="question">
        <div class="qtext">${QUESTION_TEXTS[q - 1]}</div>
        <div class="options">`;
      OPTIONS.forEach((op,i)=>{
        html += `<label class="option">
          <input type="radio" name="${id}" value="${op}" onchange="toggleCommentState('${id}', this.value)"> ${op}
        </label>`;
      });
      html += `</div>
        <div id="${id}-comment-wrap" class="comment-wrap">
          <textarea id="${id}-comment" class="comment" placeholder="Enter comment..." required></textarea>
        </div>
      </div>`;
    }
    html += `</section>`;
  }
  form.innerHTML = html;
  showSection(1);
  document.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', updateProgress));
}

function toggleCommentState(id, selectedValue){
  const commentWrap = document.getElementById(id + "-comment-wrap");
  const commentField = document.getElementById(id + "-comment");
  const isSatisfactory = selectedValue === "Satisfactory";
  const isPoor = selectedValue === "Poor";

  if (isPoor) {
    commentWrap.classList.add("show");
    commentField.setAttribute("required", "required");
  } 
   else if (isSatisfactory) {
    commentWrap.classList.add("show");
    commentField.setAttribute("required", "required");
  }
  else {
    commentWrap.classList.remove("show");
    commentField.removeAttribute("required");
    commentField.value = "";
  }
}

function showComment(id){
  const commentWrap = document.getElementById(id + "-comment-wrap");
  const commentField = document.getElementById(id + "-comment");
  commentWrap.classList.add("show");
  commentField.setAttribute("required", "required");
}
function hideComment(id){
  const commentWrap = document.getElementById(id + "-comment-wrap");
  const commentField = document.getElementById(id + "-comment");
  commentWrap.classList.remove("show");
  commentField.removeAttribute("required");
  commentField.value = "";
}

function updateProgress(){
  const total = SECTIONS*QUESTIONS_PER_SECTION;
  let answered=0;
  for(let s=1;s<=SECTIONS;s++){
    for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
      if(document.querySelector(`input[name="s${s}q${q}"]:checked`)) answered++;
    }
  }
  document.getElementById("progressText").textContent = `${answered} of ${total} questions answered`;
  document.getElementById("progressBar").style.width = `${answered/total*100}%`;
}

function collectAnswers(){
  const answers = [];
  for(let s=1;s<=SECTIONS;s++){
    for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
      const id=`s${s}q${q}`;
      const selected=document.querySelector(`input[name="${id}"]:checked`);
      const comment=document.getElementById(`${id}-comment`).value;
      answers.push({
        section: s,
        question: q,
        questionText: QUESTION_TEXTS[q - 1],
        selectedOption: selected ? selected.value : "",
        comment
      });
    }
  }
  return answers;
}

function setSaveStatus(message, isError=false){
  const status = document.getElementById("saveStatus");
  status.textContent = message;
  status.style.color = isError ? "#b91c1c" : "";
}

async function saveToGoogleSheet(){
  if(submissionInProgress) return;
  if(GOOGLE_SHEETS_WEB_APP_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL"){
    setSaveStatus("Google Sheets saving is not configured yet. Follow the setup steps in README.md.", true);
    return;
  }

  submissionInProgress = true;
  setSaveStatus("Sending responses to Google Sheets...");
  try{
    await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        className: document.getElementById("className").value,
        houseName: document.getElementById("houseName").value,
        formName: document.getElementById("formName").value,
        cadetName: document.getElementById("cadetName").value.trim(),
        cadetNumber: document.getElementById("cadetNumber").value.trim(),
        answers:collectAnswers()
      })
    });
    setSaveStatus("Submission sent.Thank you for completing the assessment!");
  } catch(error){
    setSaveStatus(`Could not send responses: ${error.message}`, true);
  } finally{
    submissionInProgress = false;
  }
}
let currentSection = 1;

function showSection(sectionNumber){
  currentSection = sectionNumber;

  document.querySelectorAll(".section").forEach((section, index)=>{
    section.classList.toggle("active", index + 1 === currentSection);
  });

  document.getElementById("sectionIndicator").textContent =
    `Section ${currentSection} of ${SECTIONS}`;

  document.getElementById("prevBtn").disabled = currentSection === 1;
  document.getElementById("saveResponsesBtn").hidden = currentSection !== SECTIONS;

  const nextBtn = document.getElementById("nextBtn");
  if(currentSection === SECTIONS){
    nextBtn.textContent = "Finish";
    nextBtn.onclick = saveToGoogleSheet;
  } else {
    nextBtn.textContent = "Next";
    nextBtn.onclick = nextSection;
  }

  window.scrollTo({top:0, behavior:"smooth"});
}

function currentSectionComplete(){
  if(currentSection === 1){
    const classField = document.getElementById("className");
    if(!classField.value){
      alert("Please select a class before moving to the next section.");
      classField.focus();
      return false;
    }
    const houseField = document.getElementById("houseName");
    if(!houseField.value){
      alert("Please select a house before moving to the next section.");
      houseField.focus();
      return false;
    }
    const formField = document.getElementById("formName");
    if(!formField.value){
      alert("Please select a form before moving to the next section.");
      formField.focus();
      return false;
    }
  }

  for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
    const radio = document.querySelector(`input[name="s${currentSection}q${q}"]:checked`);
    const commentField = document.getElementById(`s${currentSection}q${q}-comment`);

    if(!radio){
      return false;
    }

    if(radio.value === "Poor" && !commentField.value.trim()){
      alert("Please enter a comment for Poor selections before moving to the next section.");
      commentField.focus();
      return false;
    }
     else if(radio.value === "Satisfactory" && !commentField.value.trim()){
      alert("Please enter a comment for Satisfactory selections before moving to the next section.");
      commentField.focus();
      return false;
    }
    else if(radio.value === "Poor" && !commentField.value.trim()){
      alert("Please enter a comment for Poor selections before moving to the next section.");
      commentField.focus();
      return false;
    }
  }
  return true;
}

function nextSection(){
  if(!currentSectionComplete()){
    return;
  }

  if(currentSection < SECTIONS){
    showSection(currentSection + 1);
  }
}

function previousSection(){
  if(currentSection > 1){
    showSection(currentSection - 1);
  }
}

function clearForm(){
  if(!confirm("Clear all answers and comments?")) return;
  document.getElementById("assessmentForm").reset();
  document.querySelectorAll(".comment-wrap").forEach(x=>x.classList.remove("show"));
  updateProgress();
  showSection(1);
}

buildForm();
</script>
</body>
</html>
