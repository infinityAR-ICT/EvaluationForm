<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>40 Section Assessment Form</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--primary:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1000px;margin:auto;padding:22px}
header{background:#fff;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 4px 18px #0000000d}
h1{margin:0 0 8px;font-size:28px}
.subtitle{color:var(--muted)}
.section{background:var(--card);border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #0000000d}
.section-title{font-size:20px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #e8edf5}
.question{padding:16px 0;border-bottom:1px solid #edf1f6}
.question:last-child{border-bottom:0}
.qtext{font-weight:600;margin-bottom:12px}
.options{display:flex;gap:10px;flex-wrap:wrap}
.option{border:1px solid #d7deea;border-radius:10px;padding:10px 14px;cursor:pointer;background:#fff}
.option:hover{border-color:var(--primary)}
.option input{margin-right:7px}
.comment-wrap{display:none;margin-top:12px}
.comment-wrap.show{display:block}
.comment{width:100%;min-height:75px;border:1px solid #cfd8e6;border-radius:10px;padding:10px;resize:vertical;font:inherit}
.actions{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(8px);padding:14px 0;display:flex;gap:10px;justify-content:center;border-top:1px solid #e5eaf2}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:white}
.secondary{background:#e8eef8;color:#172033}
.progress{height:8px;background:#e6ebf3;border-radius:99px;overflow:hidden;margin-top:15px}
.progress-bar{height:100%;width:0;background:var(--primary);transition:.2s}
.note{font-size:13px;color:var(--muted);margin-top:10px}

.section { display:none; }
.section.active { display:block; }
.navigation {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:18px 0 80px;
}
.navigation button { min-width:120px; }
.navigation .next { margin-left:auto; }
.section-indicator {
  font-weight:700;
  margin-top:8px;
  color:#2563eb;
}

@media(max-width:600px){.container{padding:12px}.section{padding:16px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>40-Section Assessment Form</h1>
  <div class="subtitle">40 sections × 4 questions = 160 questions</div>
  <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
  <div id="progressText" class="note">0 of 160 questions answered</div>
<div id="sectionIndicator" class="section-indicator">Section 1 of 40</div>
</header>

<form id="assessmentForm"></form>

<div class="navigation">
  <button type="button" class="secondary" id="prevBtn" onclick="previousSection()">Previous</button>
  <button type="button" class="primary next" id="nextBtn" onclick="nextSection()">Next</button>
</div>

<div class="actions">
  <button type="button" class="secondary" onclick="clearForm()">Clear Form</button>
  <button type="button" class="primary" onclick="saveToGoogleDrive()">Save / Export to Excel</button>
</div>
<div id="driveStatus" class="note" role="status" aria-live="polite" style="text-align:center"></div>
</div>

<script>
const OPTIONS = ["Option 1", "Option 2", "Option 3", "Option 4"];
const SECTIONS = 40;
const QUESTIONS_PER_SECTION = 4;
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_OAUTH_CLIENT_ID";
const GOOGLE_API_KEY = "YOUR_GOOGLE_API_KEY";
const GOOGLE_DRIVE_FOLDER_ID = "15Y5Dmle5QvCul7KGRbE3RbXMSEcRCDQZ";
const GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const XLSX_MIME_TYPE = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const DRIVE_FOLDER_STORAGE_KEY = "assessmentFormDriveFolderId";
let cachedDriveToken = "";
let cachedDriveTokenExpiresAt = 0;
let googleScriptsPromise;
let driveSaveInProgress = false;

function buildForm(){
  const form = document.getElementById("assessmentForm");
  let html = "";
  for(let s=1;s<=SECTIONS;s++){
    html += `<section class="section">
      <div class="section-title">Section ${s}</div>`;
    for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
      const id = `s${s}q${q}`;
      html += `<div class="question">
        <div class="qtext">Question ${q}: Enter your question here.</div>
        <div class="options">`;
      OPTIONS.forEach((op,i)=>{
        const isFourth = i === 3;
        html += `<label class="option">
          <input type="radio" name="${id}" value="${op}" onchange="${isFourth ? `showComment('${id}')` : `hideComment('${id}')`}"> ${op}
        </label>`;
      });
      html += `</div>
        <div id="${id}-comment-wrap" class="comment-wrap">
          <textarea id="${id}-comment" class="comment" placeholder="Enter comment..."></textarea>
        </div>
      </div>`;
    }
    html += `</section>`;
  }
  form.innerHTML = html;
  showSection(1);
  document.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', updateProgress));
}

function showComment(id){
  document.getElementById(id+"-comment-wrap").classList.add("show");
}
function hideComment(id){
  document.getElementById(id+"-comment-wrap").classList.remove("show");
  document.getElementById(id+"-comment").value = "";
}

function updateProgress(){
  const total = SECTIONS*QUESTIONS_PER_SECTION;
  let answered=0;
  for(let s=1;s<=SECTIONS;s++){
    for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
      if(document.querySelector(`input[name="s${s}q${q}"]:checked`)) answered++;
    }
  }
  document.getElementById("progressText").textContent = `${answered} of ${total} questions answered`;
  document.getElementById("progressBar").style.width = `${answered/total*100}%`;
}

function exportExcel(){
  XLSX.writeFile(createWorkbook(), "assessment_responses_40_sections.xlsx");
}

function createWorkbook(){
  const wb = XLSX.utils.book_new();

  for(let s=1;s<=SECTIONS;s++){
    const rows = [["Question", "Selected Option", "Comment"]];

    for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
      const id=`s${s}q${q}`;
      const selected=document.querySelector(`input[name="${id}"]:checked`);
      const comment=document.getElementById(`${id}-comment`).value;

      rows.push([
        `Question ${q}: Enter your question here.`,
        selected ? selected.value : "",
        comment
      ]);
    }

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch:42},{wch:20},{wch:55}];
    XLSX.utils.book_append_sheet(wb, ws, `Section ${s}`);
  }

  return wb;
}

function setDriveStatus(message, isError=false, linkUrl=""){
  const status = document.getElementById("driveStatus");
  status.replaceChildren();
  status.style.color = isError ? "#b91c1c" : "";
  status.append(document.createTextNode(message));

  if(linkUrl){
    status.append(document.createTextNode(" "));
    const link = document.createElement("a");
    link.href = linkUrl;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open file in Google Drive";
    status.append(link);
  }
}

function loadGoogleScript(src, isReady){
  if(isReady()) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.onload = resolve;
    script.onerror = ()=>reject(new Error(`Unable to load Google script: ${src}`));
    document.head.append(script);
  });
}

async function ensureGoogleScripts(){
  if(!googleScriptsPromise){
    googleScriptsPromise = Promise.all([
      loadGoogleScript("https://accounts.google.com/gsi/client", ()=>Boolean(window.google?.accounts?.oauth2)),
      loadGoogleScript("https://apis.google.com/js/api.js", ()=>Boolean(window.gapi))
    ]).then(()=>new Promise((resolve, reject)=>{
      window.gapi.load("picker", {callback:resolve, onerror:()=>reject(new Error("Unable to load Google Picker."))});
    }));
  }
  return googleScriptsPromise;
}

function requestDriveAccessToken(prompt){
  return new Promise((resolve, reject)=>{
    const tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_DRIVE_SCOPE,
      callback: response=>{
        if(response.error){
          const error = new Error(response.error_description || response.error);
          error.code = response.error;
          reject(error);
          return;
        }
        cachedDriveToken = response.access_token;
        cachedDriveTokenExpiresAt = Date.now() + Number(response.expires_in || 3600) * 1000 - 60000;
        resolve(cachedDriveToken);
      },
      error_callback: error=>reject(new Error(error.message || error.type || "Google sign-in failed."))
    });
    tokenClient.requestAccessToken({prompt});
  });
}

async function getDriveAccessToken(){
  if(cachedDriveToken && Date.now() < cachedDriveTokenExpiresAt) return cachedDriveToken;
  try{
    return await requestDriveAccessToken("");
  } catch(error){
    if(error.code !== "interaction_required" && error.code !== "login_required") throw error;
    return requestDriveAccessToken("consent");
  }
}

function chooseDriveFolder(accessToken){
  const savedFolderId = localStorage.getItem(DRIVE_FOLDER_STORAGE_KEY);
  if(savedFolderId === GOOGLE_DRIVE_FOLDER_ID) return Promise.resolve(savedFolderId);

  return new Promise((resolve, reject)=>{
    const view = new window.google.picker.DocsView(window.google.picker.ViewId.FOLDERS)
      .setIncludeFolders(true)
      .setSelectFolderEnabled(true)
      .setMimeTypes("application/vnd.google-apps.folder");
    const picker = new window.google.picker.PickerBuilder()
      .addView(view)
      .setOAuthToken(accessToken)
      .setDeveloperKey(GOOGLE_API_KEY)
      .setTitle("Select the shared destination folder")
      .setCallback(data=>{
        if(data.action === window.google.picker.Action.CANCEL){
          reject(new Error("Folder selection was canceled."));
          return;
        }
        if(data.action !== window.google.picker.Action.PICKED) return;

        const selectedFolderId = data.docs?.[0]?.id;
        if(selectedFolderId !== GOOGLE_DRIVE_FOLDER_ID){
          reject(new Error("Select the configured destination folder to continue."));
          return;
        }
        localStorage.setItem(DRIVE_FOLDER_STORAGE_KEY, selectedFolderId);
        resolve(selectedFolderId);
      })
      .build();
    picker.setVisible(true);
  });
}

async function uploadWorkbookToDrive(accessToken, folderId, workbookBlob){
  const boundary = `assessment_form_${Date.now()}_${Math.random().toString(16).slice(2)}`;
  const metadata = {
    name: "assessment_responses_40_sections.xlsx",
    mimeType: XLSX_MIME_TYPE,
    parents: [folderId]
  };
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`,
    `--${boundary}\r\nContent-Type: ${XLSX_MIME_TYPE}\r\n\r\n`,
    workbookBlob,
    `\r\n--${boundary}--`
  ], {type:`multipart/related; boundary=${boundary}`});
  const response = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${accessToken}`,
      "Content-Type": `multipart/related; boundary=${boundary}`
    },
    body
  });
  const result = await response.json();
  if(!response.ok){
    throw new Error(result.error?.message || `Google Drive upload failed (${response.status}).`);
  }
  return result;
}

async function saveToGoogleDrive(){
  if(driveSaveInProgress) return;
  if(GOOGLE_CLIENT_ID === "YOUR_GOOGLE_OAUTH_CLIENT_ID" || GOOGLE_API_KEY === "YOUR_GOOGLE_API_KEY"){
    setDriveStatus("Google Drive is not configured yet. Follow the setup steps in README.md.", true);
    return;
  }

  driveSaveInProgress = true;
  setDriveStatus("Connecting to Google Drive...");
  try{
    await ensureGoogleScripts();
    const accessToken = await getDriveAccessToken();
    setDriveStatus("Choose the shared destination folder in Google Picker...");
    const folderId = await chooseDriveFolder(accessToken);
    setDriveStatus("Saving the Excel file to Google Drive...");
    const workbook = createWorkbook();
    const workbookBytes = XLSX.write(workbook, {bookType:"xlsx", type:"array"});
    const workbookBlob = new Blob([workbookBytes], {type:XLSX_MIME_TYPE});
    const uploadedFile = await uploadWorkbookToDrive(accessToken, folderId, workbookBlob);
    setDriveStatus("Excel file saved successfully.", false, uploadedFile.webViewLink);
  } catch(error){
    const message = error.message === "Folder selection was canceled."
      ? error.message
      : `Could not save to Google Drive: ${error.message}`;
    setDriveStatus(message, error.message !== "Folder selection was canceled.");
  } finally{
    driveSaveInProgress = false;
  }
}
let currentSection = 1;

function showSection(sectionNumber){
  currentSection = sectionNumber;

  document.querySelectorAll(".section").forEach((section, index)=>{
    section.classList.toggle("active", index + 1 === currentSection);
  });

  document.getElementById("sectionIndicator").textContent =
    `Section ${currentSection} of ${SECTIONS}`;

  document.getElementById("prevBtn").disabled = currentSection === 1;

  const nextBtn = document.getElementById("nextBtn");
  if(currentSection === SECTIONS){
    nextBtn.textContent = "Finish";
    nextBtn.onclick = saveToGoogleDrive;
  } else {
    nextBtn.textContent = "Next";
    nextBtn.onclick = nextSection;
  }

  window.scrollTo({top:0, behavior:"smooth"});
}

function currentSectionComplete(){
  for(let q=1;q<=QUESTIONS_PER_SECTION;q++){
    if(!document.querySelector(`input[name="s${currentSection}q${q}"]:checked`)){
      return false;
    }
  }
  return true;
}

function nextSection(){
  if(!currentSectionComplete()){
    alert("Please select an option for all 4 questions before going to the next section.");
    return;
  }

  if(currentSection < SECTIONS){
    showSection(currentSection + 1);
  }
}

function previousSection(){
  if(currentSection > 1){
    showSection(currentSection - 1);
  }
}

function clearForm(){
  if(!confirm("Clear all answers and comments?")) return;
  document.getElementById("assessmentForm").reset();
  document.querySelectorAll(".comment-wrap").forEach(x=>x.classList.remove("show"));
  updateProgress();
  showSection(1);
}

buildForm();
</script>
</body>
</html>
